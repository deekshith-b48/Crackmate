<!doctype html><html lang="en"><meta charset="utf-8">
<style>body{font:16px system-ui;color:#171d35}button,select,input{margin:5px;padding:8px}button{cursor:pointer}</style>
<label>Voice <select id="voice"></select></label>
<label>Speed <input id="rate" type="range" min="0.6" max="1.4" step="0.1" value="1"></label>
<button id="play">Play / replay question</button><button id="stop">Stop speaking</button>
<p id="status" role="status">Choose Play to hear the question. Stop speech before recording.</p>
<script>
let question="",voices=[];
const synth=window.speechSynthesis;
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},"*");
const status=document.getElementById("status");
function refresh(){
 voices=synth.getVoices().filter(v=>v.lang.startsWith("en"));
 const select=document.getElementById("voice");select.replaceChildren();
 voices.forEach((v,i)=>{let option=document.createElement("option");option.value=i;option.textContent=v.name;select.append(option)});
 if(!voices.length)status.textContent="No English voices available. Read the question or try another browser.";
}
window.addEventListener("message",event=>{
 if(event.data.type==="streamlit:render"){
   const next=event.data.args.question;
   if(next!==question && synth)synth.cancel();
   question=next;
 }
});
if(synth){
 refresh();synth.addEventListener("voiceschanged",refresh);
 document.getElementById("play").onclick=()=>{
   synth.cancel();if(!voices.length)return;
   const utterance=new SpeechSynthesisUtterance(question);
   utterance.voice=voices[Number(document.getElementById("voice").value)];
   utterance.rate=Number(document.getElementById("rate").value);
   utterance.onend=()=>status.textContent="Playback finished.";
   utterance.onerror=()=>status.textContent="Playback unavailable. Read the displayed question.";
   status.textContent="Speaking. Stop before recording.";synth.speak(utterance);
 };
 document.getElementById("stop").onclick=()=>{synth.cancel();status.textContent="Stopped."};
 window.addEventListener("pagehide",()=>synth.cancel());
}else status.textContent="Speech synthesis is unavailable. Use the displayed question.";
send("streamlit:componentReady",{apiVersion:1});send("streamlit:setFrameHeight",{height:150});
</script></html>
